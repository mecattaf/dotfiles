# palette.conf: the command palette entry points of the client's Sway session.
#
# What it is. The only place Sway names the palette. Ruling R3: Vicinae is
# the only palette (Linear and claude.ai style: one key, then type a verb).
# Mod+space and Mod+d, and the leader chords f and space in modes.conf, all
# exec ONE script name, ~/.local/bin/palette, so the GPUIX phase swaps the
# backend in that script and no key line changes.
# Ownership. The script ~/.local/bin/palette (home/dot_local/bin/palette in
# the dotfiles) is owned by lane code-launcher-palette, not by this file.
# TODO(code-launcher-palette, 2026-10-22): land home/dot_local/bin/palette;
# until it exists the guard below falls back to `vicinae toggle`, which is
# exactly what Mod+space and Mod+d ran before this rewrite (INFERRED safe).
# What it replaced. `bindsym $mod+d exec vicinae toggle` and
# `bindsym $mod+space exec vicinae toggle` from binds.conf (2026-10-08), and
# the Mod+v clipboard history line, moved here unchanged, 2026-10-22.
# What is deliberately absent. No palette verbs (they live in home/vicinae.nix
# and docs/shell/SHELL.md), no second launcher, no Mod+k (protected).
# Rules: every bindsym carries `## <group> | <verb> | <doc>` directly above.
set $palette sh -c '[ -x ~/.local/bin/palette ] && exec ~/.local/bin/palette || exec vicinae toggle'

## palette | palette.toggle | Open or close the command palette
bindsym $mod+space exec $palette
## palette | palette.toggle | Open or close the command palette (second key, i3 habit)
bindsym $mod+d exec $palette
## palette | clipboard.history | Clipboard history view of the palette
bindsym $mod+v exec vicinae cmd launch clipboard:history

