# Never parsed by sway. Whether sway leaves `~` inside the quoted sh -c
# argument for sh to expand was not measured (INFERRED from sway's variable
# expansion touching only `$name`). The palette script does not exist yet.
# No second reader (Tom's light verification rule, 2026-10-20).
