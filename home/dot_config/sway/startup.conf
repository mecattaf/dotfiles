# Session units (Vicinae, Mako) follow sway-physical-session.target.
# Exec runs once per compositor start, never on reload.
exec wl-gammarelay-rs run
# Vicinae owns clipboard history; do not start a second cliphist watcher.
exec sh -c 'sleep 0.5 && kanshi'
exec gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec gsettings set org.gnome.desktop.interface cursor-size 48
exec gsettings set org.gnome.desktop.interface text-scaling-factor 1.0
exec gsettings set org.gnome.desktop.wm.preferences button-layout ''
exec theme apply
exec gsettings set com.github.stunkymonkey.nautilus-open-any-terminal terminal kitty
