# Stock Sway has no animation engine. One tiled window fills the output.
font pango:Anthropic Sans 11
set $mod Mod4
gaps inner 0
gaps outer 0
smart_gaps off
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
workspace_layout default
focus_wrapping no
floating_modifier $mod normal
tiling_drag enable
xwayland enable

output * bg #000000 solid_color
