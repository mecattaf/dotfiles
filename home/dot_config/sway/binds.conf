# binds.conf: the default mode key map of the client's Sway session.
#
# What it is. Every bindsym of the default mode except the palette entry
# points (palette.conf) and the chords inside modes (modes.conf). The chord
# set is niri/binds.kdl and scroll/binds.conf restored on Sway (2026-10-08);
# only what Sway does differently is noted inline.
# What it replaced. The 2026-10-08 binds.conf, rewritten 2026-10-22 on branch
# dryrun/shell-consolidation-2026-10-22 so that every bindsym carries one
# machine readable comment directly above it:
#     ## <group> | <verb> | <doc>
# tools/keymap/gen-keymap.py (lane code-keymap-generator) parses these into
# docs/shell/KEYMAP.md. A bindsym without that comment is a bug.
# What is deliberately absent. No bar, no mode indicator (GPUIX port, see
# docs/shell/DEFERRED.md), no Vicinae spelling (palette.conf owns it), no
# chord moved: the shape rule (ruling R2: Mod plus one key navigates, Mod
# Shift moves or creates, Mod Ctrl opens pickers, plain F keys are hardware)
# describes this map, it did not rewrite it. The bare Ctrl+N grabs are the
# flagged exception to R2.
# flake.nix asserts seven whole lines of this file (the three herdr chords and
# Alt+h/j/k/l); keep them byte for byte.
set $prompt kitty --class

## herdr | picker.open | Herdr workspace picker (rows from herdr, rendered by the palette dmenu)
bindsym $mod+Ctrl+space exec ~/.local/bin/herdr-picker
## herdr | projector.new | New Herdr projector window for the focused slot
bindsym $mod+Return exec ~/.local/bin/herdr-chord new
## terminal | terminal.local | Plain local kitty with fish, no Herdr
bindsym $mod+Shift+Return exec kitty -e fish
## herdr | projector.sidebar | Herdr projector with the sidebar
bindsym $mod+Ctrl+Shift+Return exec ~/.local/bin/herdr-chord sidebar
## slots | slot.rename | Rename the focused workspace slot
bindsym $mod+Shift+n exec ~/.local/bin/sway-workspace rename
## slots | slot.new | Open a new workspace slot
bindsym $mod+t exec ~/.local/bin/sway-workspace new
## slots | slot.restore | Restore the last closed workspace slot
bindsym $mod+Shift+t exec ~/.local/bin/sway-workspace restore
## slots | slot.close | Close or park the focused workspace slot
bindsym $mod+w exec ~/.local/bin/sway-workspace close
# Kill the local projector window: Herdr's server keeps its PTYs and agents.
## window | window.kill | Close the focused window (a projector only detaches)
bindsym $mod+Shift+q kill

# Chrome on Mod+N / Ctrl+N as on niri and scroll (the bare Ctrl+N grabs were
# restored by request; they shadow the focused app's own Ctrl+N everywhere).
## apps | chrome.new | Chrome (bare Ctrl grab, flagged exception to R2)
bindsym Ctrl+n exec google-chrome-stable
## apps | chrome.incognito | Chrome incognito (bare Ctrl grab, flagged exception to R2)
bindsym Ctrl+Shift+n exec google-chrome-stable --incognito
## apps | chrome.new | Chrome
bindsym $mod+n exec google-chrome-stable
## apps | chrome.incognito | Chrome incognito
bindsym $mod+Ctrl+n exec google-chrome-stable --incognito
## apps | files.open | Nautilus file manager
bindsym $mod+e exec nautilus

# Chrome webapps and OBS.
## apps | webapp.claude | claude.ai as a Chrome app window
bindsym $mod+Shift+c exec google-chrome-stable --app=https://claude.ai/
## apps | webapp.mail | Gmail as a Chrome app window
bindsym $mod+Shift+w exec google-chrome-stable --app=https://mail.google.com/
## apps | webapp.calendar | Notion Calendar as a Chrome app window
bindsym $mod+Shift+period exec google-chrome-stable --app=https://calendar.notion.so/
## apps | obs.open | OBS Studio
bindsym $mod+Shift+semicolon exec obs

# Colour under the cursor to the clipboard (grim + slurp -p).
## capture | color.pick | Colour under the cursor to the clipboard
bindsym $mod+c exec ~/.local/bin/colorpicker
# Clipboard text read aloud through the speech daemon.
## tools | clipboard.speak | Read the clipboard text aloud
bindsym $mod+Ctrl+r exec ~/.local/bin/speak-clipboard

# Screenshots (bin/screenshot, the niri chords): saved under
# ~/Pictures/Screenshots and copied to the clipboard; area and window open
# Satty for optional annotation, Esc keeps the plain capture. On the client
# the file goes to the strix's ~/Pictures/Screenshots and none stays local.
## capture | screenshot.screen | Screenshot of the focused output
bindsym $mod+s exec ~/.local/bin/screenshot screen
## capture | screenshot.area | Screenshot of a selected area, Satty to annotate
bindsym $mod+Shift+s exec ~/.local/bin/screenshot area
## capture | screenshot.window | Screenshot of the focused window, Satty to annotate
bindsym $mod+Alt+s exec ~/.local/bin/screenshot window
# Area -> text: OCR on the worker's Halogen via the strix, into the clipboard.
## capture | ocr.area | OCR of a selected area into the clipboard
bindsym $mod+Ctrl+s exec ~/.local/bin/screen-ocr-area

# One Herdr per numbered slot. Mod+1..9 live on the top display (eDP-1),
# Mod+0 (workspace 10) is the bottom display (eDP-2). Mod+Shift+N sends the focused window.
workspace 1 output eDP-1
workspace 2 output eDP-1
workspace 3 output eDP-1
workspace 4 output eDP-1
workspace 5 output eDP-1
workspace 6 output eDP-1
workspace 7 output eDP-1
workspace 8 output eDP-1
workspace 9 output eDP-1
workspace 10 output eDP-2
## slots | slot.focus.1 | Go to slot 1 (eDP-1)
bindsym $mod+1 workspace number 1
## slots | slot.focus.2 | Go to slot 2 (eDP-1)
bindsym $mod+2 workspace number 2
## slots | slot.focus.3 | Go to slot 3 (eDP-1)
bindsym $mod+3 workspace number 3
## slots | slot.focus.4 | Go to slot 4 (eDP-1)
bindsym $mod+4 workspace number 4
## slots | slot.focus.5 | Go to slot 5 (eDP-1)
bindsym $mod+5 workspace number 5
## slots | slot.focus.6 | Go to slot 6 (eDP-1)
bindsym $mod+6 workspace number 6
## slots | slot.focus.7 | Go to slot 7 (eDP-1)
bindsym $mod+7 workspace number 7
## slots | slot.focus.8 | Go to slot 8 (eDP-1)
bindsym $mod+8 workspace number 8
## slots | slot.focus.9 | Go to slot 9 (eDP-1)
bindsym $mod+9 workspace number 9
## slots | slot.focus.10 | Go to slot 10 (eDP-2, the bottom display)
bindsym $mod+0 workspace number 10
## slots | slot.send.1 | Send the focused window to slot 1
bindsym $mod+Shift+1 move container to workspace number 1
## slots | slot.send.2 | Send the focused window to slot 2
bindsym $mod+Shift+2 move container to workspace number 2
## slots | slot.send.3 | Send the focused window to slot 3
bindsym $mod+Shift+3 move container to workspace number 3
## slots | slot.send.4 | Send the focused window to slot 4
bindsym $mod+Shift+4 move container to workspace number 4
## slots | slot.send.5 | Send the focused window to slot 5
bindsym $mod+Shift+5 move container to workspace number 5
## slots | slot.send.6 | Send the focused window to slot 6
bindsym $mod+Shift+6 move container to workspace number 6
## slots | slot.send.7 | Send the focused window to slot 7
bindsym $mod+Shift+7 move container to workspace number 7
## slots | slot.send.8 | Send the focused window to slot 8
bindsym $mod+Shift+8 move container to workspace number 8
## slots | slot.send.9 | Send the focused window to slot 9
bindsym $mod+Shift+9 move container to workspace number 9
## slots | slot.send.10 | Send the focused window to slot 10 (eDP-2)
bindsym $mod+Shift+0 move container to workspace number 10
## slots | slot.prev | Previous slot on this output
bindsym $mod+Up workspace prev_on_output
## slots | slot.next | Next slot on this output
bindsym $mod+Down workspace next_on_output
## slots | slot.carry.prev | Carry the focused window to the previous slot on this output
bindsym $mod+Shift+Up move container to workspace prev_on_output; workspace prev_on_output
## slots | slot.carry.next | Carry the focused window to the next slot on this output
bindsym $mod+Shift+Down move container to workspace next_on_output; workspace next_on_output
# Wheel: button4/5 = wheel up/down, button6/7 = wheel left/right.
## slots | slot.prev | Wheel up: previous slot on this output
bindsym --whole-window $mod+button4 workspace prev_on_output
## slots | slot.next | Wheel down: next slot on this output
bindsym --whole-window $mod+button5 workspace next_on_output
## slots | slot.carry.prev | Ctrl wheel up: carry the window to the previous slot
bindsym --whole-window $mod+Ctrl+button4 move container to workspace prev_on_output; workspace prev_on_output
## slots | slot.carry.next | Ctrl wheel down: carry the window to the next slot
bindsym --whole-window $mod+Ctrl+button5 move container to workspace next_on_output; workspace next_on_output
## navigate | focus.left | Wheel left: focus the window to the left
bindsym --whole-window $mod+button6 focus left
## navigate | focus.right | Wheel right: focus the window to the right
bindsym --whole-window $mod+button7 focus right

## navigate | focus.left | Focus left
bindsym $mod+h focus left
## navigate | focus.down | Focus down
bindsym $mod+j focus down
## navigate | focus.up | Focus up (Mod+K is protected, Tom 2026-10-07 as reported in KEYS.md)
bindsym $mod+k focus up
## navigate | focus.right | Focus right
bindsym $mod+l focus right
## move | move.left | Move the focused window left
bindsym $mod+Shift+h move left
## move | move.down | Move the focused window down
bindsym $mod+Shift+j move down
## move | move.up | Move the focused window up
bindsym $mod+Shift+k move up
## move | move.right | Move the focused window right
bindsym $mod+Shift+l move right
## move | move.left | Move the focused window left (niri column chord)
bindsym $mod+bracketleft move left
## move | move.right | Move the focused window right (niri column chord)
bindsym $mod+bracketright move right
## output | output.focus.left | Focus the output to the left (AGENTS.md seat rule)
bindsym Alt+h focus output left
## output | output.focus.down | Focus the output below (the bottom display)
bindsym Alt+j focus output down
## output | output.focus.up | Focus the output above (the top display)
bindsym Alt+k focus output up
## output | output.focus.right | Focus the output to the right
bindsym Alt+l focus output right
## output | output.move.left | Move the slot to the output on the left
bindsym $mod+Alt+h move workspace to output left
## output | output.move.down | Move the slot to the output below
bindsym $mod+Alt+j move workspace to output down
## output | output.move.up | Move the slot to the output above
bindsym $mod+Alt+k move workspace to output up
## output | output.move.right | Move the slot to the output on the right
bindsym $mod+Alt+l move workspace to output right

## layout | fullscreen.toggle | Toggle fullscreen
bindsym $mod+f fullscreen toggle
## layout | fullscreen.toggle | Toggle fullscreen (second key)
bindsym $mod+equal fullscreen toggle
## layout | split.horizontal | Next window splits horizontally
bindsym $mod+b splith
## layout | split.vertical | Next window splits vertically
bindsym $mod+Ctrl+v splitv
## layout | floating.toggle | Toggle floating for the focused window
bindsym $mod+Tab floating toggle
## layout | focus.mode.toggle | Swap focus between tiled and floating
bindsym $mod+Shift+Tab focus mode_toggle
## layout | layout.tabbed | Tabbed layout
bindsym $mod+Ctrl+t layout tabbed
## layout | layout.stacking | Stacking layout
bindsym $mod+Ctrl+Shift+s layout stacking
## layout | layout.split.toggle | Toggle split direction
bindsym $mod+Ctrl+e layout toggle split
## layout | resize.shrink | Shrink width by 5 percent of the output
bindsym $mod+minus resize shrink width 5 ppt
## layout | resize.grow | Grow width by 5 percent of the output
bindsym $mod+plus resize grow width 5 ppt
## session | config.reload | Reload the Sway config
bindsym $mod+Shift+r reload
## session | inhibitor.toggle | Toggle the app keyboard shortcuts inhibitor (works while inhibited)
bindsym --inhibited $mod+Escape seat - shortcuts_inhibitor toggle
# niri power-off-monitors woke on any input; Sway does not, so the script
# arms a one-shot swayidle resume.
## session | monitors.off | Turn the monitors off until the next input
bindsym $mod+Shift+p exec ~/.local/bin/monitors-off

# Media and hardware keys (F1 to F10).
# F1 is free. F2 theme / Shift+F2 accent (niri repeat=false = --no-repeat).
# The plain F-keys below are the Glove80's. The Duo's own keyboard never
# sends them for its F1-F6 legends: the dock daemon runs it with fn_lock on,
# so F1/F2/F3 arrive as XF86AudioMute/LowerVolume/RaiseVolume, F4 is the
# keyboard backlight (handled inside the daemon, no keysym) and F5/F6 are
# re-emitted as XF86MonBrightnessDown/Up (captured from Sway's binding
# events, 2026-10-10). Those XF86 keysyms are bound here and in
# sway-local.conf (home.nix), which also takes F10 for the backlight toggle
# and the Duo's mic-mute key. volume/brightness pop one OSD per press.
## hardware | theme.pick | Theme prompt (fzf in a floating kitty)
bindsym --no-repeat F2 exec $prompt theme-prompt -e ~/.local/bin/theme-prompt theme
## hardware | accent.pick | Accent prompt (fzf in a floating kitty)
bindsym --no-repeat Shift+F2 exec $prompt theme-prompt -e ~/.local/bin/theme-prompt accent
## hardware | touchpad.toggle | Toggle the touchpad (Caps Lock is Menu, input.conf)
bindsym --no-repeat Menu exec ~/.local/bin/touchpad-toggle
## media | media.play | Play or pause
bindsym F3 exec ~/.local/bin/media play
## media | media.prev | Previous track
bindsym F4 exec ~/.local/bin/media prev
## media | media.next | Next track
bindsym F5 exec ~/.local/bin/media next
## media | volume.mute | Mute output audio
bindsym F6 exec ~/.local/bin/volume mute
## media | volume.down | Volume down
bindsym F7 exec ~/.local/bin/volume down
## media | volume.up | Volume up
bindsym F8 exec ~/.local/bin/volume up
## hardware | audio.route | Audio route prompt
bindsym F9 exec $prompt audio-route-prompt -e ~/.local/bin/audio-route
## hardware | call.record | Call recording menu
bindsym Shift+F9 exec $prompt call-record-prompt -e ~/.local/bin/call-record-menu
## hardware | monitors.sleep | Sleep monitors prompt (the client's sway-local.conf rebinds F10 to the backlight)
bindsym F10 exec $prompt sleep-monitors-prompt -e ~/.local/bin/sleep-monitors
## hardware | pomodoro.menu | Pomodoro menu
bindsym Shift+F10 exec $prompt pomodoro-prompt -e ~/.local/bin/pomodoro menu
## media | volume.up | Volume up (Duo key, also on the lock screen)
bindsym --locked XF86AudioRaiseVolume exec ~/.local/bin/volume up
## media | volume.down | Volume down (Duo key, also on the lock screen)
bindsym --locked XF86AudioLowerVolume exec ~/.local/bin/volume down
## media | volume.mute | Mute (Duo key, also on the lock screen)
bindsym --locked XF86AudioMute exec ~/.local/bin/volume mute
## media | media.play | Play or pause (also on the lock screen)
bindsym --locked XF86AudioPlay exec ~/.local/bin/media play
## media | media.next | Next track (also on the lock screen)
bindsym --locked XF86AudioNext exec ~/.local/bin/media next
## media | media.prev | Previous track (also on the lock screen)
bindsym --locked XF86AudioPrev exec ~/.local/bin/media prev

# Not verified (written with one hash so the keymap parser skips it)
# Never parsed by sway (no compositor run in this lane). Byte equality of the
# seven flake asserted lines was checked by grep only, not by nix eval.
# No second reader (Tom's light verification rule, 2026-10-20).
