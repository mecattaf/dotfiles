# Browser owns its reserved workspace, including Chrome's Xwayland fallback.
assign [app_id="^google-chrome$"] workspace number 10
assign [class="^Google-chrome$"] workspace number 10
for_window [app_id="^chrome-.*"] shortcuts_inhibitor disable
for_window [app_id="^google-chrome$"] shortcuts_inhibitor disable
for_window [app_id="^gcr-prompter$"] floating enable
for_window [app_id="^org\.pulseaudio\.pavucontrol$"] floating enable
for_window [app_id="^pavucontrol$"] floating enable
for_window [app_id="^blueman-manager$"] floating enable
for_window [app_id="^io\.bassi\.Amberol$"] floating enable
for_window [app_id="firefox$" title="^Picture-in-Picture$"] floating enable, sticky enable

# The fzf-in-kitty prompt tier (F2, F9, Shift+F9, F10, Shift+F10): floating,
# centred, fixed size, as niri/window-rules.kdl and scroll/rules.conf had them.
for_window [app_id="^(sleep-monitors|audio-route|call-record)-prompt$"] floating enable, resize set width 640 px height 200 px, move position center, border pixel 2
for_window [app_id="^(theme|pomodoro)-prompt$"] floating enable, resize set width 640 px height 300 px, move position center, border pixel 2

# Music pane (bin/music-pane): the SoundCloud PWA is marked `music`, floated
# to the right 40 % of the output and parked in the scratchpad; Mod+M shows/hides it.
for_window [app_id="^chrome-soundcloud\.com__-Default$"] mark --add music, floating enable, resize set width 40 ppt height 100 ppt, move position 60 ppt 0 ppt, move scratchpad, scratchpad show
