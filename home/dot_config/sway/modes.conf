# modes.conf: the leader mode (vimium style single key chords) and resize mode.
#
# What it is. Mod+g enters "leader": the next single key acts and drops back
# to the default mode, the way vimium turns plain keys into navigation. The
# chord shapes repeat the default map so nothing new has to be learnt:
# h j k l focus, H J K L move, 1 to 9 and 0 go to a slot, t new slot,
# w close slot, f or space open the palette, r enters resize, Escape,
# Return or Mod+g again leave. Mod+r enters resize directly.
# Source. Lane brief (2026-10-22) and docs/gpuix-shell/KEYS.md on branch
# experimental/gpuix-shell, because spec/KEYBINDING-DOCTRINE.md did not exist
# at minute 6 of this lane (MEASURED by ls). Mod+g and Mod+r were unbound in
# binds.conf and in the client's sway-local.conf (MEASURED by grep).
# What it replaced. Nothing: no mode existed before 2026-10-22.
# What is deliberately absent. No on screen mode indicator: there is no bar
# (ruling R3 era decision, sway/config header) so leader is silent; the
# indicator is a GPUIX port (docs/shell/DEFERRED.md). Keys not bound here pass
# through to the focused window, as Sway does in any mode, so a stray key in
# leader still reaches the app; leader does not swallow input (INFERRED from
# Sway's mode semantics, not tested).
# Rules: every bindsym carries `## <group> | <verb> | <doc>` directly above.
# Inside a mode block the group equals the mode name; the two entry chords
# sit in the default mode and carry the group of the mode they open.
set $leader "leader"
set $resize "resize"

## leader | mode.leader | Enter leader mode: the next single key acts, then default mode returns
bindsym $mod+g mode $leader
## resize | mode.resize | Enter resize mode
bindsym $mod+r mode $resize

mode $leader {
    ## leader | focus.left | Focus left, leave leader
    bindsym h focus left; mode default
    ## leader | focus.down | Focus down, leave leader
    bindsym j focus down; mode default
    ## leader | focus.up | Focus up, leave leader
    bindsym k focus up; mode default
    ## leader | focus.right | Focus right, leave leader
    bindsym l focus right; mode default
    ## leader | move.left | Move the focused window left, leave leader
    bindsym Shift+h move left; mode default
    ## leader | move.down | Move the focused window down, leave leader
    bindsym Shift+j move down; mode default
    ## leader | move.up | Move the focused window up, leave leader
    bindsym Shift+k move up; mode default
    ## leader | move.right | Move the focused window right, leave leader
    bindsym Shift+l move right; mode default
    ## leader | slot.focus.1 | Go to slot 1, leave leader
    bindsym 1 workspace number 1; mode default
    ## leader | slot.focus.2 | Go to slot 2, leave leader
    bindsym 2 workspace number 2; mode default
    ## leader | slot.focus.3 | Go to slot 3, leave leader
    bindsym 3 workspace number 3; mode default
    ## leader | slot.focus.4 | Go to slot 4, leave leader
    bindsym 4 workspace number 4; mode default
    ## leader | slot.focus.5 | Go to slot 5, leave leader
    bindsym 5 workspace number 5; mode default
    ## leader | slot.focus.6 | Go to slot 6, leave leader
    bindsym 6 workspace number 6; mode default
    ## leader | slot.focus.7 | Go to slot 7, leave leader
    bindsym 7 workspace number 7; mode default
    ## leader | slot.focus.8 | Go to slot 8, leave leader
    bindsym 8 workspace number 8; mode default
    ## leader | slot.focus.9 | Go to slot 9, leave leader
    bindsym 9 workspace number 9; mode default
    ## leader | slot.focus.10 | Go to slot 10 on eDP-2, leave leader
    bindsym 0 workspace number 10; mode default
    ## leader | slot.new | Open a new workspace slot, leave leader
    bindsym t exec ~/.local/bin/sway-workspace new; mode default
    ## leader | slot.close | Close or park the focused slot, leave leader
    bindsym w exec ~/.local/bin/sway-workspace close; mode default
    ## leader | palette.toggle | Open the command palette, leave leader
    bindsym f exec $palette; mode default
    ## leader | palette.toggle | Open the command palette, leave leader
    bindsym space exec $palette; mode default
    ## leader | mode.resize | Switch from leader to resize mode
    bindsym r mode $resize
    ## leader | mode.default | Leave leader mode
    bindsym Escape mode default
    ## leader | mode.default | Leave leader mode
    bindsym Return mode default
    ## leader | mode.default | Leave leader mode (second press of the entry chord)
    bindsym $mod+g mode default
}

mode $resize {
    ## resize | resize.shrink.width | Shrink width by 10 px or 5 percent
    bindsym h resize shrink width 10 px or 5 ppt
    ## resize | resize.grow.height | Grow height by 10 px or 5 percent
    bindsym j resize grow height 10 px or 5 ppt
    ## resize | resize.shrink.height | Shrink height by 10 px or 5 percent
    bindsym k resize shrink height 10 px or 5 ppt
    ## resize | resize.grow.width | Grow width by 10 px or 5 percent
    bindsym l resize grow width 10 px or 5 ppt
    ## resize | resize.shrink.width.fine | Shrink width by 2 px or 1 percent
    bindsym Shift+h resize shrink width 2 px or 1 ppt
    ## resize | resize.grow.height.fine | Grow height by 2 px or 1 percent
    bindsym Shift+j resize grow height 2 px or 1 ppt
    ## resize | resize.shrink.height.fine | Shrink height by 2 px or 1 percent
    bindsym Shift+k resize shrink height 2 px or 1 ppt
    ## resize | resize.grow.width.fine | Grow width by 2 px or 1 percent
    bindsym Shift+l resize grow width 2 px or 1 ppt
    ## resize | mode.default | Leave resize mode
    bindsym Escape mode default
    ## resize | mode.default | Leave resize mode
    bindsym Return mode default
    ## resize | mode.default | Leave resize mode (second press of the entry chord)
    bindsym $mod+r mode default
}

# Not verified (one hash so the keymap parser skips it)
# Never parsed by sway; mode block syntax, `$palette` reuse from palette.conf
# (include order puts palette.conf first) and comment lines inside mode
# blocks are INFERRED from sway(5), not measured. No second reader (Tom's
# light verification rule, 2026-10-20).
