# vim:ft=kitty
#
# kitten ssh — per-destination options for `kitten ssh <host>` (and for
# `hk ssh --plain`, which spends the same kitten). kitty reads this file
# automatically as ~/.config/kitty/ssh.conf; `hostname` opens a section that
# applies to the destinations it matches, and the options under it are the
# `kitten ssh` ones, NOT kitty.conf options.
#
# WHY IT EXISTS (2026-09-11). The laptop became the fleet's only seat, and the
# gesture that defines it is "type into the coordinator from here": Mod+Return
# is `kitty -e hk ssh --in-place coordinator`, and `kitten ssh coordinator` is
# the plain-terminal twin. Both arrive over sshd, which starts the account's
# LOGIN shell — and the fleet login shell is bash everywhere (see kitty.conf:3-11
# and #236: sshd and non-interactive exec must be parsed by bash, so the passwd
# shell is bash and fish is the terminal UI on top). kitty.conf's `shell fish`
# only covers shells kitty itself spawns locally, so without this file every
# remote kitten session landed in bash — no abbreviations, no fish history, none
# of the UI Tom actually works in. Naming fish as the kitten's login shell, per
# destination below, puts the remote end back on the same footing as a local
# kitty window.
#
# The three sections are the whole fleet address book: `coordinator`, `worker`
# and `nas` are the operator nicknames from home/ssh.nix, which is what gets
# typed. They are listed separately rather than as one glob because a future
# per-host difference (a different remote shell on the NAS appliance, say) then
# has an obvious place to land.
#
# DELIBERATELY NOT SET HERE:
#
#   share_connections — left at kitten ssh's default (on). It multiplexes the
#     kitten's own connections through its own control path and is the reason
#     the fleet ssh_config carries no ControlMaster of its own (home/ssh.nix).
#
#   forward_remote_control — left at the default (off), and it could not work
#     if it were on: kitty.conf:82 sets `listen_on unix:@kitty-{kitty_pid}`, an
#     abstract-namespace socket. Abstract sockets live in the kernel's network
#     namespace and have no filesystem path, so there is nothing for ssh to
#     forward; remote control stays local to the seat by construction.
#
#   cwd / env / copy — nothing is pushed across the seam. What the remote
#     session sees comes from the coordinator's own home-manager generation,
#     which is the point of a thin client.

hostname coordinator
login_shell fish

hostname worker
login_shell fish

hostname nas
login_shell fish
