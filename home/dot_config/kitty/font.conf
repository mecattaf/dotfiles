# vim:ft=kitty
#
# font.conf: the terminal face, included by kitty.conf at the position the
# font block used to hold (split out 2026-10-22, dryrun/shell-consolidation).
# It names a FAMILY, never a file. The bytes are pressed by pkgs/fontbuilder,
# live in a tarball on the NAS M.2 and enter the store through requireFile in
# pkgs/anthropic-mono-nerd.nix; no font binary is ever committed (docs/fonts).
# Deliberately absent: symbol_map, modify_font, any file path. The history of
# earlier faces (JetBrainsMono, Maple Mono, Liga SFMono) and the 2026-09-17
# measurements moved to README.md in this folder.
#
# Rulings that still hold:
# 1. Family and style are given as family="..." style="...". kitty does not
#    split a "family style" string; it looks it up verbatim in the font name
#    tables and falls silently to fc-match on a miss. The patcher caps nameID4
#    at 31 characters, so "AnthropicMono Nerd Font SemiBold" is not a key.
#    The style string is an exact literal: a typo such as "Semi Bold" resolves
#    to the wrong weight without any error (measured 2026-09-17).
# 2. Bold is SemiBold (Tom, 2026-08-21: keep the weight the old fallback
#    actually served). kitty's own `auto` would pick SemiBold too.
# 3. Reverting the face is two files: modules/common.nix defaultFonts and this
#    block, together. Reverting this file alone resolves every non exact line
#    into the Anthropic family.
# 4. font_size 16.0 (2026-09-16): Tom pressed ctrl+= once in every new kitty;
#    in kitty 0.48.0 that is a fixed +2.0 pt step, so 14.0 plus one press is
#    now the starting size.
# 5. symbol_map stays EMPTY. kitty draws box drawing, braille, powerline and
#    legacy computing cells itself before symbol_map is consulted, and a
#    symbol_map range is a hard map with no fall through, so mapping CJK to a
#    face that lacks it replaces working Noto CJK with notdef boxes
#    (measured 2026-09-17).
# 6. `modify_font cell_height` is left unset on purpose: the face is 3.70
#    percent shorter in rows than Liga SFMono at 96 dpi and the column count is
#    unchanged (README.md, history).

font_family      family="AnthropicMono Nerd Font"
bold_font        family="AnthropicMono Nerd Font" style="SemiBold"
italic_font      family="AnthropicMono Nerd Font" style="Italic"
bold_italic_font family="AnthropicMono Nerd Font" style="SemiBold Italic"
font_size        16.0
disable_ligatures never
