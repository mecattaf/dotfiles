# vim:ft=kitty
#
# maps.conf: every key and mouse map kitty adds on top of its defaults,
# included by kitty.conf right after kitty-scrollback-nix.conf, so the
# kitty_scrollback_nvim action alias that file defines is already declared
# when the maps below name it (split out 2026-10-22,
# dryrun/shell-consolidation). Deliberately absent: `clear_all_shortcuts`
# (kitty's ctrl+shift defaults stay live: new window, new tab, copy, paste)
# and any map on a reserved chord listed at the end of this file. The old
# commented reference block of kitty defaults was dropped; it only restated
# kitty's built in map and is summarised in README.md.
#
# GRAMMAR. Every `map` or `mouse_map` line has exactly one comment directly
# above it of the form
#     ## <group> | <verb> | <doc>
# group and verb are lower case words (letters, digits, spaces), doc is one
# line of plain prose with no pipe. Same shape as the Sway binds.conf
# comments, so one generator (tools/keymap) can read both. Regex:
#     ^## ([a-z][a-z0-9 ]*) \| ([a-z][a-z0-9 ]*) \| ([^|]+)$
# kitty_mod is kitty's default, ctrl+shift; nothing here redefines it.

## font | grow | Ctrl and equals raises the font size one step without Shift (kitty 0.48.0 step is 2.0 pt)
map ctrl+equal increase_font_size
## font | shrink | Ctrl and minus lowers the font size one step without Shift
map ctrl+minus decrease_font_size

## scrollback | browse | Ctrl Shift H opens the whole scrollback in nvim through kitty scrollback nvim
map kitty_mod+h kitty_scrollback_nvim
## scrollback | last output | Ctrl Shift G opens only the last command output in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
## scrollback | clicked output | Ctrl Shift right click selects the clicked command output and opens it in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# RESERVED CHORDS. Never map these in kitty.
#
# For herdr (REPORTED home/dot_config/herdr/config.toml [keys], and the
# projector contract in kitty.conf):
#   ctrl+b   herdr's prefix, pinned explicitly. kitty maps nothing on it so it
#            reaches the projector; every herdr verb is prefix plus one key.
#   ctrl+v   herdr's keys.remote_image_paste: an image on this laptop's
#            clipboard is staged on the strix and its path pasted into the pane.
#   remote control (allow_remote_control, listen_on in kitty.conf) is how
#   ~/.local/bin/herdr-chord types herdr chords into a projector window; it is
#   a reservation of the socket, not of a key.
#
# For Sway (REPORTED home/dot_config/sway/binds.conf, which grabs these before
# any client sees them, so a kitty map on them would never fire):
#   super, every chord     $mod is Mod4; the compositor owns it whole.
#   ctrl+n, ctrl+shift+n   Chrome and Chrome incognito. The R2 exception: bare
#                          Ctrl chords grabbed globally ("restored by
#                          request", binds.conf comment, undated). Inside
#                          kitty, fish and nvim never receive ctrl+n.
#   alt+h, alt+j, alt+k, alt+l   focus output left, down, up, right.
#   F2, shift+F2, F3 through F10, shift+F9, shift+F10, Menu, XF86 media keys
#                          hardware and theme keys.
#
# Not verified: kitty was not run against this file; the grammar regex was
# checked with a Python script, not with the keymap generator.
