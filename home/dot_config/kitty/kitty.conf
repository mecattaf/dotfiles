# vim:ft=kitty
#
# kitty.conf: the terminal layer of the client seat. Every kitty window is a
# fish UI on this laptop or a herdr projector onto the strix.
# Restructured 2026-10-22 (dryrun/shell-consolidation): the font block moved
# to font.conf, every map line to maps.conf, and the dead revert blocks and
# kitty's commented default map reference to README.md. Every active setting
# keeps its value (README.md records the before and after diff).
# Deliberately absent: colours (the theme fragment owns them), font file paths,
# `read-clipboard` in clipboard_control, background opacity, cursor trail.
# Include order matters: font.conf sits where the font block was; maps.conf
# follows kitty-scrollback-nix.conf, which defines the kitty_scrollback_nvim
# alias the maps use; the theme fragment comes last so it wins on colour.

# tom's login shell is bash fleet wide (#236): sshd and non interactive exec
# must be parsed by bash. fish stays the terminal UI, so every window kitty
# spawns itself (new window, new tab, `kitty @ launch` children, nautilus
# "open in terminal") takes fish explicitly instead of the passwd shell.
# ssh.conf is the twin for `kitten ssh`; herdr config.toml default_shell is the
# twin for herdr panes.
shell fish

# Font: AnthropicMono Nerd Font by family name only (font.conf).
include font.conf

# Cursor
cursor_blink_interval 0

# Padding around the text area
window_padding_width 10

detect_urls yes
open_url_with default
underline_hyperlinks always
confirm_os_window_close 0
scrollback_lines 100000
enable_audio_bell no
copy_on_select clipboard
# THE THIN CLIENT CLIPBOARD CONTRACT (2026-09-11). This is kitty 0.48.0's
# default, written down because the laptop is the fleet's only seat and
# everything the operator reads and yanks runs on the strix, behind a herdr
# pane or a plain ssh. A remote program may WRITE this laptop's clipboard over
# OSC 52 (a yank in a strix side nvim reaches the seat that way, see
# nvim/lua/options.lua's osc52 copy only provider); a remote READ prompts.
# Adding `read-clipboard` would let anything the strix runs exfiltrate the
# seat's clipboard silently, so it must never be added. Accepted defect: kitty
# applies a write only while the window is focused.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
remember_window_size  no

# Splits layout stays enabled: kitty's own split verbs and any kitten that
# asks for `--location=vsplit` need it.
enabled_layouts splits

# Remote control, required by kitty-scrollback.nvim and by herdr-chord.
allow_remote_control yes
# Abstract socket, unique per kitty instance, so `kitty @` from a shell spawned
# by a given kitty reaches THAT kitty rather than whichever process won the
# race for /tmp/kitty (a kitty spawned by the compositor must be addressable
# on its own).
listen_on unix:@kitty-{kitty_pid}
# Shell integration for command tracking (scrollback last output maps).
shell_integration enabled
# kitty-scrollback.nvim: lazy-nix-helper resolves the plugin from /nix/store,
# so home-manager (home/home.nix) emits the action_alias with the store path
# baked in, at a NEUTRAL path: kitty/ is a whole dir out of store symlink, so a
# managed file cannot live inside it. kitty expands env vars in include paths.
include ${HOME}/.config/kitty-scrollback-nix.conf

# Every key and mouse map, each with a `## group | verb | doc` line (maps.conf).
include maps.conf

# herdr projector (#385, 2026-09-13). herdr-kitten is removed fleet wide: it
# could not cross the ssh boundary to the strix's one server. kitty maps
# nothing for herdr, so ctrl+b reaches herdr as its prefix; the herdr chords
# (Mod+Return, Mod+Ctrl+Shift+Return, Mod+Shift+N) are typed into a projector
# window by ~/.local/bin/herdr-chord through the remote control above. herdr's
# own scrollback editor is prefix+e.
#
# CLIPBOARD CONTRACT for a projector (`herdr --remote`, herdr 0.9.0). Ctrl+V
# with an image on this laptop's Wayland clipboard, or dropping ONE image file
# onto the window, is read locally, staged on the strix under
# /tmp/herdr-clipboard-images-1000/, and that absolute path is bracket pasted
# into the focused pane, which Claude Code and Codex attach as an image.
# Limits: no bmp for Claude Code; one file per drop; an image over 16 MiB makes
# the server disconnect the projector (herdr-projector reconnects it). Ctrl+V
# is herdr's `keys.remote_image_paste`, read from THIS box's herdr config.toml.

# Colours (2026-09-17): every colour key lives in the theme fragment
# ~/.config/theme/kitty.conf, the symlink ~/.local/bin/theme retargets between
# the themes home/theme.nix renders under ~/.config/themes/ (noir, claude-dark,
# claude-light). The symlink flip fires no watcher event, so `theme` also calls
# `kitten @ load-config` on every instance. The tab bar edge stays here: it is
# layout, not colour.
include ${HOME}/.config/theme/kitty.conf
tab_bar_edge top
