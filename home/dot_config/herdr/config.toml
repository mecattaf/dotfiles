# herdr — github.com/herdrdev/herdr, pinned at 0.9.0 in flake.lock.
#
# THIS FILE IS WRITABLE AND LIVE. home/herdr.nix delivers it as a SINGLE-FILE
# out-of-store symlink (~/.config/herdr/config.toml → this path in the git
# checkout), so editing it here changes the running server's config with no
# rebuild — reload it in place with prefix+shift+r. The rest of
# ~/.config/herdr stays a real writable directory that herdr owns at runtime:
# the server socket, the session store, and plugins.json, which is NEVER
# generated from nix (`herdr plugin link` stays imperative).
#
# herdr edits this file back when a setting is changed from inside the app
# (theme, status indicators, sound, toasts). Those writes are surgical
# key upserts, so comments and untouched keys survive — but they DO land in
# the git tree as ordinary unstaged edits. That is the deal RAW makes.
#
# Every value below is a deliberate choice; herdr's own defaults are noted
# where they differ.

# Never run the first-run onboarding flow. Load-bearing: onboarding ends by
# WRITING a config, and this path is a tracked file in the dotfiles repo.
onboarding = false

[keys]
# herdr's default, pinned explicitly so a future upstream change to the
# default prefix can't silently move every binding under it.
prefix = "ctrl+b"

[theme]
# "terminal" (2026-09-17): every token is an ANSI slot or Reset
# (src/app/state.rs Palette::terminal), so kitty paints herdr — chrome AND every
# pane — in whatever theme ~/.local/bin/theme has selected, and re-paints it
# live: herdr enables DEC mode 2031 on the host (src/terminal_theme.rs), kitty
# reports a changed default background as CSI ?997;n on reload, and herdr
# answers with a full OSC 10/11/4 re-query. Nothing here ever changes again for
# a theme switch. Before this there was no [theme] section at all, i.e. herdr's
# default catppuccin — not noir. Do NOT pick a theme from herdr's in-app
# settings overlay: it upserts `name` and `auto_switch = false` into THIS
# tracked file (src/config/write.rs). auto_switch stays off — it only chooses
# between two built-in names and ignores `name` while on.
name = "terminal"

[terminal]
# fish is the terminal UI here; bash is only the LOGIN shell (#236). herdr's
# default for this key is empty, which means "$SHELL, then /bin/sh" — and the
# $SHELL the server inherits is the passwd entry, i.e. bashInteractive. So
# every herdr pane (Mod+Return -> a new workspace) came up in bash, while
# kitty's own `shell fish` only governs the windows kitty starts itself. This
# is the herdr-side twin of that kitty.conf line.
#
# Absolute, and deliberately NOT a store path: /run/current-system/sw/bin is
# where modules/common.nix's `programs.fish.enable` puts fish, it survives a
# rebuild, and the server (a systemd user unit with no login-shell PATH) does
# not have to resolve a bare name.
default_shell = "/run/current-system/sw/bin/fish"
# "auto" is herdr's default and means login shells on macOS only — on Linux new
# panes stay non-login, which is what fish's conf.d/ init expects.
shell_mode = "auto"
# New panes, tabs and workspaces open in the cwd of the pane they were
# created from (herdr's default, pinned): the behavior the deleted
# new-terminal script used to hand-roll.
new_cwd = "follow"

[session]
# THE LIFECYCLE RULE (#352/#355, Role A). Preservation follows the process,
# not the window:
#   - Explicit exit (Ctrl+C, an agent's /exit) CLOSES the conversation: the
#     child dies, herdr removes the pane (src/app/actions.rs handle_pane_died)
#     and the next snapshot does not carry it, so it is never resurrected.
#   - Closing a kitty projector or prefix+q only DETACHES: the live pane stays
#     resumable from any projector (sidebar, Mod+Ctrl+Shift+Return, #385).
#   - A server restart restores the LAYOUT. The option below relaunches an
#     agent only where the snapshot carries its session ref
#     (src/persist/restore.rs pane_restore_startup); every other pane is a
#     fresh shell in its cwd. Layout restored is not proof the process came
#     back.
#   - Preserved is not free: `herdr-panes` lists live panes with agent,
#     status and last activity; `herdr-panes close <pane-id>` ends one on
#     purpose, rather than closing whichever Kitty window once showed it. Use `claude-sessions` when recovering transcript identities
# across cc, cc2 and cc3; a ~/.claude-only sweep is knowingly incomplete.
# Restoring a session puts Claude Code / codex panes back into their own
# conversation, not just a fresh shell in the right directory.
resume_agents_on_restore = true

[update]
# Nix owns this binary; the version is the flake.lock rev and moves only when
# the input is bumped. A self-update nag about a store path nobody can write
# is noise (upstream default: true).
version_check = false
# Agent DETECTION manifests are data, not the binary — let herdr keep its
# knowledge of which processes are agents current (upstream default: true).
manifest_check = true

[ui]
# kitty owns the window title. Empty leaves it alone; herdr's default
# ("{hostname}: {workspace}") would fight the terminal for it.
window_title = ""
# The workspaces sidebar is off by default and toggled on demand with
# prefix+b: the compositor is the layout authority here, and a persistent panel just
# spends columns.
sidebar_start_collapsed = true
# Collapsed means GONE, not a compact rail (upstream default: "compact").
sidebar_collapsed_mode = "hidden"
# TABS (Tom 2026-09-11: "i really do not like Tabs"). herdr has no switch to
# disable tabs — a workspace always has at least one — but it can hide the
# row while there is only one, which is every workspace Mod+Return creates
# (upstream default: false). A second tab appears only when something makes
# one: prefix+c, `herdr tab create`, or a pane moved with --new-tab; close it
# with prefix+shift+x (or `herdr tab close <tab_id>`) and the row goes away
# again. Sessions live in WORKSPACES here, one per Mod+Return: prefix+w is
# the workspace picker, prefix+g the session navigator across everything,
# prefix+shift+n a new workspace, prefix+shift+d closes one, prefix+q
# detaches this client and leaves the pane running.
hide_tab_bar_when_single_tab = true

[experimental]
# Kitty graphics passthrough for attached clients is unprobed against this
# kitty; leave it off until it is actually tested (upstream default: false).
kitty_graphics = false
# NB: `pane_history` is deliberately ABSENT. It defaults off, and turning it on
# would persist pane screen contents — secrets included — to
# session-history.json on disk.

[ui.sidebar.agents]
# herdr's defaults are [["state_icon","workspace","tab"], ["agent"]]. These rows
# apply to every agent without a rows_by_agent override, custom reported agents
# included (configuration.mdx:428).
#
# $summary / $attempt / $campaign are dynamic pane metadata, not literal text:
# they render only for panes whose reporter published them with
# `pane report-metadata --token`, and they disappear when unreported or expired.
# For a Claude Code or codex pane none of them are set, so those two rows vanish
# and the layout collapses back to herdr's shape. Styling stays here — reporters
# provide values only (configuration.mdx:446). Cap is 16 rows × 16 tokens.
rows = [
  ["state_icon", "agent", "state_text"],
  ["$summary"],
  ["$attempt", "$campaign"],
  ["workspace", "tab"],
]
