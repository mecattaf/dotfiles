# vim: ft=swayconfig
# niri/layout.kdl ported. Colours: ~/.config/theme/scroll.conf (theme renderer).

# niri `gaps 0`
gaps inner 0
gaps outer 0
smart_gaps off

# niri `focus-ring off` + `border { on; width 1 }`: niri always draws the
# border, so no hide_edge_borders here (the scroll-era `smart` is not the kernel).
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders none

# niri `center-focused-column "on-overflow"` + `always-center-single-column`
center_horizontal_if_fits true

# niri preset-column-widths / preset-window-heights / default-column-width
layout_widths [0.33333333 0.5 0.66666667 1.0]
layout_heights [0.33333333 0.5 0.66666667 1.0]
layout_default_width 1.0
layout_default_height 1.0

# niri Mod+Down past the last workspace lands on an empty trailing one.
workspace_next_on_output_create_empty true

# niri's scrolling model does not wrap focus.
focus_wrapping no
