# vim: ft=swayconfig
# niri/startup.kdl ported. `exec` runs once per session start (not on reload),
# like niri's spawn-at-startup. The env import and scroll-session.target come
# from /etc/scroll/config.d/10-session.conf (included first by ./config): do NOT
# add SWAYSOCK / I3SOCK / XDG_CURRENT_DESKTOP=sway imports here.

exec wl-gammarelay-rs run
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
# kanshi after the gamma relay: its profiles' busctl lines need the relay.
# Not the Home Manager kanshi service (it would render a second config).
exec sh -c 'sleep 0.5 && kanshi'
# swaybg with the selected wallpaper (no `output * bg` lines in this config).
exec wallpaper

# gsettings that are not theme-owned (cursor, text scale, no titlebar buttons).
exec gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec gsettings set org.gnome.desktop.interface cursor-size 48
exec gsettings set org.gnome.desktop.interface text-scaling-factor 1.0
exec gsettings set org.gnome.desktop.wm.preferences button-layout ''
# gtk-theme, icon-theme, color-scheme and the libadwaita variables: the theme
# script is their ONE writer (home/theme.nix, ~/.local/bin/theme apply).
exec theme apply
exec gsettings set com.github.stunkymonkey.nautilus-open-any-terminal terminal kitty
