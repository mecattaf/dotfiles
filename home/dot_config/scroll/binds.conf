# vim: ft=swayconfig
# niri/binds.kdl ported, bind for bind. `# @title` comments carry niri's
# hotkey-overlay-title; the CUBS hotkey overlay will read them beside
# `scrollmsg -t get_bindings` (GET_BINDINGS expands variables, GET_CONFIG
# returns only this main file). Rationale comments for each chord live in the
# niri file's history; only what changed in the port is noted here.

set $mod Mod4
set $scripts ~/.config/scroll/scripts
set $prompt kitty --class


# ── Application Launchers ────────────────────────────────────

# THE INVERSION (spec B11): Mod+Return is herdr, Mod+Shift+Return is plain.
# herdr-chord drives ONE projector window (#385); see ~/.local/bin/herdr-chord.
# @title Terminal (herdr)
bindsym $mod+Return exec ~/.local/bin/herdr-chord new
# @title Terminal (plain)
bindsym $mod+Shift+Return exec kitty -e fish
# @title herdr sidebar
bindsym $mod+Ctrl+Shift+Return exec ~/.local/bin/herdr-chord sidebar
# @title Rename workspace (herdr)
bindsym $mod+Shift+n exec ~/.local/bin/herdr-chord rename

# @title Launcher
bindsym $mod+d exec $prompt launcher-prompt -e ~/.local/bin/launcher
# Reserved: Mod+Shift+D — secondary launcher

# @title File Manager
bindsym $mod+e exec nautilus

# @title Theme (cycle)
bindsym $mod+Shift+t exec ~/.local/bin/theme toggle

# Bare Ctrl+N / Ctrl+Shift+N are global compositor launchers (restored by
# request); they shadow the focused app's own Ctrl+N everywhere.
# @title Chrome
bindsym Ctrl+n exec google-chrome-stable
# @title Chrome (incognito)
bindsym Ctrl+Shift+n exec google-chrome-stable --incognito
# @title Chrome
bindsym $mod+n exec google-chrome-stable
# @title Chrome (incognito)
bindsym $mod+Ctrl+n exec google-chrome-stable --incognito


# ── Desktop Utilities ─────────────────────────────────────────

# @title Clipboard
bindsym $mod+v exec $prompt clipboard-prompt -e ~/.local/bin/clipboard
# Reserved for the CUBS shell: Mod+O notifications, Mod+Comma settings,
# Mod+B control center, Mod+I bar.


# ── Screenshots ──────────────────────────────────────────────

# @title Screenshot
bindsym $mod+s exec ~/.local/bin/screenshot screen
# @title Screenshot Area (annotate)
bindsym $mod+Shift+s exec ~/.local/bin/screenshot area
# @title Screenshot Window (annotate)
bindsym $mod+Alt+s exec ~/.local/bin/screenshot window
# @title Screenshot Area → OCR
bindsym $mod+Ctrl+s exec ~/.local/bin/screen-ocr-area


# ── Read Aloud ───────────────────────────────────────────────

# @title Read clipboard aloud
bindsym $mod+Ctrl+r exec ~/.local/bin/speak-clipboard


# ── Color Picker ─────────────────────────────────────────────

# scroll has no pick-color action; bin/colorpicker uses grim + slurp -p.
# @title Color Picker
bindsym $mod+c exec ~/.local/bin/colorpicker


# ── Media & Hardware Keys (F1-F10) ───────────────────────────

# F1 is free. F2 theme / Shift+F2 accent (niri `repeat=false` = --no-repeat).
# @title Theme
bindsym --no-repeat F2 exec $prompt theme-prompt -e ~/.local/bin/theme-prompt theme
# @title Accent (wallpaper + folders)
bindsym --no-repeat Shift+F2 exec $prompt theme-prompt -e ~/.local/bin/theme-prompt accent
# @title Play/Pause
bindsym F3 exec ~/.local/bin/media play
# @title Previous
bindsym F4 exec ~/.local/bin/media prev
# @title Next
bindsym F5 exec ~/.local/bin/media next
# @title Mute
bindsym F6 exec ~/.local/bin/volume mute
# @title Volume Down
bindsym F7 exec ~/.local/bin/volume down
# @title Volume Up
bindsym F8 exec ~/.local/bin/volume up
# @title Audio Route
bindsym F9 exec $prompt audio-route-prompt -e $scripts/audio-route
# @title Call Recording
bindsym Shift+F9 exec $prompt call-record-prompt -e $scripts/call-record-menu
# @title Sleep Monitors
bindsym F10 exec $prompt sleep-monitors-prompt -e $scripts/sleep-monitors
# @title Pomodoro
bindsym Shift+F10 exec $prompt pomodoro-prompt -e ~/.local/bin/pomodoro menu


# ── Chrome Webapps ───────────────────────────────────────────

bindsym $mod+Shift+c exec google-chrome-stable --app=https://claude.ai/
# Music pane: piri's right-side scratchpad becomes scroll's native scratchpad
# plus the mark `music` (scripts/music-pane; the window rule is in rules.conf).
# Mod+M toggles it (first press spawns the SoundCloud PWA); Mod+Shift+M
# captures the focused window as the music window.
# @title Music (toggle)
bindsym $mod+m exec $scripts/music-pane toggle
# @title Music (capture focused)
bindsym $mod+Shift+m exec $scripts/music-pane capture
bindsym $mod+Shift+w exec google-chrome-stable --app=https://mail.google.com/
bindsym $mod+Shift+semicolon exec obs
bindsym $mod+Shift+period exec google-chrome-stable --app=https://calendar.notion.so/


# ── Utilities ────────────────────────────────────────────────

# Reserved: Mod+I — toggle top bar (CUBS shell).
# Mod+Slash (niri show-hotkey-overlay): waits for the CUBS shell, which builds
# the overlay from get_bindings + the @title comments in this file.


# ── Window Management ────────────────────────────────────────

bindsym $mod+Shift+q kill
bindsym $mod+Tab floating toggle
bindsym $mod+Shift+Tab focus mode_toggle


# ── Focus Navigation ─────────────────────────────────────────

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Home focus beginning
bindsym $mod+End focus end


# ── Window/Column Movement ───────────────────────────────────

# niri consume-or-expel-window-left/right: scroll's `move … nomode` expels
# from a column, then inserts into the neighbour (scroll(5) `move`).
bindsym $mod+Shift+h move left nomode
bindsym $mod+Shift+l move right nomode
bindsym $mod+bracketleft move left nomode
bindsym $mod+bracketright move right nomode

# niri move-column-to-monitor-*: niri follows focus, so chain `focus output`.
bindsym $mod+Shift+j move container to output down; focus output down
bindsym $mod+Shift+k move container to output up; focus output up
bindsym $mod+Alt+h move container to output left; focus output left
bindsym $mod+Alt+l move container to output right; focus output right

bindsym $mod+Alt+j move down nomode
bindsym $mod+Alt+k move up nomode

# Monitor focus (AGENTS.md seat rule): Alt+H/L left/right monitor on the
# strix's two 5Ks, Alt+J/K down/up (the Zenbook's stacked panels).
bindsym Alt+h focus output left
bindsym Alt+j focus output down
bindsym Alt+k focus output up
bindsym Alt+l focus output right


# ── Column/Window Sizing ─────────────────────────────────────

bindsym $mod+f cycle_size h next
bindsym $mod+Shift+f cycle_size h prev
bindsym $mod+g cycle_size v next
bindsym $mod+Shift+g cycle_size v prev
# niri set-column-width "-10%"
bindsym $mod+minus resize shrink width 10 ppt


# ── Fullscreen ───────────────────────────────────────────────

# niri fullscreen-window
bindsym $mod+equal fullscreen toggle
# niri maximize-column: a toggle that restores the previous size.
bindsym $mod+Shift+equal toggle_size this 1.0 1.0
# The "fake fullscreen" Tom asked for (WM-MIGRATION-COMMENTS.md): the app
# believes it is fullscreen and stays tiled. NEW chord, not in the niri kernel
# (scroll-era Mod+Ctrl+equal); `fullscreen_application` was renamed upstream
# to `fullscreen toggle application` (7ea9842f).
# @title Fake fullscreen (application)
bindsym $mod+Ctrl+equal fullscreen toggle application
# niri maximize-window-to-edges: with gaps 0 it is the same toggle.
bindsym $mod+Ctrl+f toggle_size this 1.0 1.0


# ── Overview ─────────────────────────────────────────────────

# niri toggle-overview -> scroll's all-workspaces-per-output overview.
bindsym --no-repeat $mod+Page_Up scale_workspaces toggle
bindsym --no-repeat $mod+Page_Down scale_workspaces toggle
bindsym --no-repeat $mod+Alt+Up scale_workspaces toggle
bindsym --no-repeat $mod+Alt+Down scale_workspaces toggle
bindsym --no-repeat $mod+Ctrl+o scale_workspaces toggle


# ── Workspace Navigation ─────────────────────────────────────

# niri workspace indices are PER OUTPUT; sway/scroll numbers are global.
# scripts/ws-index keeps niri's meaning: the Nth workspace of the focused
# output, the last one when there are fewer (Mod+0 = 10, ruling-record R4).
bindsym $mod+1 exec $scripts/ws-index focus 1
bindsym $mod+2 exec $scripts/ws-index focus 2
bindsym $mod+3 exec $scripts/ws-index focus 3
bindsym $mod+4 exec $scripts/ws-index focus 4
bindsym $mod+5 exec $scripts/ws-index focus 5
bindsym $mod+6 exec $scripts/ws-index focus 6
bindsym $mod+7 exec $scripts/ws-index focus 7
bindsym $mod+8 exec $scripts/ws-index focus 8
bindsym $mod+9 exec $scripts/ws-index focus 9
bindsym $mod+0 exec $scripts/ws-index focus 10
bindsym $mod+Ctrl+1 exec $scripts/ws-index move 1
bindsym $mod+Ctrl+2 exec $scripts/ws-index move 2
bindsym $mod+Ctrl+3 exec $scripts/ws-index move 3
bindsym $mod+Ctrl+4 exec $scripts/ws-index move 4
bindsym $mod+Ctrl+5 exec $scripts/ws-index move 5
bindsym $mod+Ctrl+6 exec $scripts/ws-index move 6
bindsym $mod+Ctrl+7 exec $scripts/ws-index move 7
bindsym $mod+Ctrl+8 exec $scripts/ws-index move 8
bindsym $mod+Ctrl+9 exec $scripts/ws-index move 9

bindsym $mod+Down workspace next_on_output
bindsym $mod+Up workspace prev_on_output
bindsym $mod+Shift+Down move container to workspace next_on_output; workspace next_on_output
bindsym $mod+Shift+Up move container to workspace prev_on_output; workspace prev_on_output

# Wheel. niri's cooldown-ms=150 has no scroll twin: a high-resolution wheel may
# skip workspaces. button4/5 = wheel up/down, button6/7 = wheel left/right.
bindsym --whole-window $mod+button5 workspace next_on_output
bindsym --whole-window $mod+button4 workspace prev_on_output
bindsym --whole-window $mod+Ctrl+button5 move container to workspace next_on_output; workspace next_on_output
bindsym --whole-window $mod+Ctrl+button4 move container to workspace prev_on_output; workspace prev_on_output
bindsym --whole-window $mod+button7 focus right
bindsym --whole-window $mod+button6 focus left


# ── niri-specific chords ─────────────────────────────────────

# Mod+W (toggle-column-tabbed-display): NO scroll equivalent; scroll removed
# sway's tabbed/stacking layouts. Dropped pending Tom (scoping D8).

# niri allow-inhibiting=false: --inhibited keeps the chord alive while an app
# holds the shortcuts inhibitor.
bindsym --inhibited $mod+Escape seat - shortcuts_inhibitor toggle

# niri power-off-monitors woke on any input; sway does not, so the script
# arms a one-shot swayidle resume.
bindsym $mod+Shift+p exec $scripts/monitors-off
