# vim: ft=swayconfig
# niri/input.kdl ported. Fleet-wide: per-device touch mapping belongs in the
# generated ~/.config/scroll-local.conf (client only).

input type:keyboard {
    xkb_options caps:none
    xkb_numlock enabled
}

# Also covers the strix's Apple Magic Trackpad (hosts/strix/trackpad.nix).
input type:touchpad {
    tap enabled
    dwt enabled
    natural_scroll enabled
    accel_profile adaptive
    click_method clickfinger
}

input type:pointer {
    accel_profile flat
}

# niri `clipboard { disable-primary }`
primary_selection disabled

# niri is click-to-focus.
focus_follows_mouse no
mouse_warping output

# Touchpad gestures: niri's implicit set, made explicit.
#   3-finger horizontal: scroll the strip (niri: move the view)
#   3-finger vertical:   workspace switch on the focused output
#   4-finger vertical:   overview
# [test] whether gesture_scroll also consumes vertical 3-finger swipes; if it
# does, move the two workspace gestures to 4 fingers and overview to pinch.
gesture_scroll_enable true
gesture_scroll_fingers 3
gesture_scroll_sensitivity 1.0

bindgesture {
    swipe:3:up    workspace next_on_output
    swipe:3:down  workspace prev_on_output
    swipe:4:up    scale_workspaces toggle
    swipe:4:down  scale_workspaces toggle
}
