# vim: ft=swayconfig
# niri/window-rules.kdl ported. scroll can size AND position floating windows
# from a rule, which niri could not; it cannot colour one window's border
# (client.* is global), so the prompts' #DA7756 orange border is dropped until
# dawsers adds per-window colour (scoping D8). New windows take focus by
# default, which covers niri's `open-focused true`.

# Chrome PWAs and Chrome: let compositor chords through (scroll era).
for_window [app_id="^chrome-.*"] shortcuts_inhibitor disable

for_window [app_id="^io\.bassi\.Amberol$"] floating enable

# Satty (bin/screenshot's annotation step): tiled and maximized, not floating.
for_window [app_id="^com\.gabm\.satty$"] toggle_size this 1.0 1.0

# The fzf-in-kitty prompt tier (2026-09-11): floating, centred, fixed size.
for_window [app_id="^(sleep-monitors|audio-route|call-record)-prompt$"] floating enable, resize set width 640 px height 200 px, move position center, border pixel 2
for_window [app_id="^(theme|pomodoro)-prompt$"] floating enable, resize set width 640 px height 300 px, move position center, border pixel 2
for_window [app_id="^launcher-prompt$"] floating enable, resize set width 800 px height 500 px, move position center, border pixel 2
for_window [app_id="^clipboard-prompt$"] floating enable, resize set width 640 px height 400 px, move position center, border pixel 2

# The scroll-era geometry niri could not express.
for_window [app_id="^blueman-manager$"] floating enable, resize set 35 ppt 35 ppt, move position 63 ppt 60 ppt
for_window [app_id="^pavucontrol$"] floating enable, resize set 35 ppt 35 ppt, move position 63 ppt 60 ppt

# Firefox Picture-in-Picture: floating and on every workspace.
for_window [app_id="firefox$" title="^Picture-in-Picture$"] floating enable, sticky enable

# Music pane (scripts/music-pane): the SoundCloud PWA is marked `music`, floated
# to the right 40 % of the output (piri's fromRight 40% x 100%) and parked in
# the scratchpad; Mod+M shows/hides it.
for_window [app_id="^chrome-soundcloud\.com__-Default$"] mark --add music, floating enable, resize set width 40 ppt height 100 ppt, move position 60 ppt 0 ppt, move scratchpad, scratchpad show

# Nautilus / the GTK file chooser: niri blurs behind MacTahoe's translucent
# gtk-4.0 surfaces (niri/window-rules.kdl). scroll has no blur, so those
# surfaces show the wallpaper or window beneath unfrosted. MacTahoe stays
# (non-negotiable); blur behind translucent surfaces is a job for the owned
# scroll-based fork, never a reason to move GTK onto libadwaita colours.
# WezTerm's niri rule is dropped: no bind uses wezterm.
