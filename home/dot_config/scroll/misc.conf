# vim: ft=swayconfig
# niri/misc.kdl ported.

# Animations. niri runs springs; scroll runs Bezier curves, so these are the
# niri durations re-expressed (frequency_ms is gone upstream, 350b03e1).
# Tune by feel on the 120 Hz Zenbook and the 60 Hz 5Ks.
#   workspace switch ~35 ms, view/window movement and resize ~25 ms,
#   overview ~80 ms, window open 25 ms ease-out-expo, close 25 ms ease-out-quad.
animations {
    enabled yes
    style clip
    default yes 35 var simple [ 0.25 0.1 0.25 1 ]
    workspace_switch yes 35 var simple [ 0.25 0.1 0.25 1 ]
    window_move yes 25 var simple [ 0.25 0.1 0.25 1 ]
    window_size yes 25 var simple [ 0.25 0.1 0.25 1 ]
    overview yes 80 var simple [ 0.25 0.1 0.25 1 ]
    window_open yes 25 var simple [ 0.16 1 0.3 1 ]
    fade_out yes 25 var simple [ 0.5 1 0.89 1 ]
}

# niri `prefer-no-csd`: sway asks clients for server-side decorations by
# default; borders are default_border in layout.conf.

# niri `cursor { xcursor-theme; xcursor-size 48; hide-after-inactive-ms 1000 }`
seat seat0 xcursor_theme Bibata-Modern-Classic 48
seat seat0 hide_cursor 1000

# Native Xwayland (lazy). Replaces niri's xwayland-satellite.
xwayland enable

# Mouse: Mod+drag moves a floating window, Mod+right-drag resizes (niri implicit).
floating_modifier Mod4 normal
tiling_drag enable

# Config errors: scroll's own bar until the CUBS shell takes them
# (`scrollnag_command cubsctl config-error` from a cubs.d fragment).
