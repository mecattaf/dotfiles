# Hyprland 0.56.0. Stock compositor; Google Chrome + Herdr/kitty own their apps.
# Sway files remain a recovery session, independent of this configuration.
source = /etc/hypr/physical-session.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/layout.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/startup.conf
source = ~/.config/hyprland-local.conf
source = ~/.config/theme/hyprland.conf
