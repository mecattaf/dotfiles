$mod = SUPER
monitor = , preferred, auto, 2
general {
    layout = dwindle
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgb(c18d69)
    col.inactive_border = rgb(46433f)
    resize_on_border = true
}
dwindle {
    preserve_split = true
}
decoration {
    rounding = 6
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000044)
    }
}
animations {
    enabled = true
    bezier = desk, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, desk
    animation = windowsOut, 1, 2, desk, popin 98%
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, desk, slidevert
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    force_default_wallpaper = 0
    focus_on_activate = false
}
group {
    groupbar {
        font_family = Anthropic Sans
        font_size = 11
        height = 24
    }
}
