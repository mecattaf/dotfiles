# Existing Sway chords, ported to Hyprland; new shell on Super+grave and Super+comma.
bind = $mod, d, exec, desktop-shell launcher
bind = $mod, space, exec, desktop-shell launcher
bind = $mod CTRL, space, exec, ~/.local/bin/herdr-picker
bind = $mod, Return, exec, ~/.local/bin/herdr-chord new
bind = $mod SHIFT, Return, exec, kitty -e fish
bind = $mod CTRL SHIFT, Return, exec, ~/.local/bin/herdr-chord sidebar
bind = $mod SHIFT, n, exec, ~/.local/bin/desktop-workspace rename
bind = $mod, t, exec, ~/.local/bin/desktop-workspace new
bind = $mod SHIFT, t, exec, ~/.local/bin/desktop-workspace restore
bind = $mod, w, exec, ~/.local/bin/desktop-workspace close
bind = CTRL, n, exec, google-chrome-stable
bind = CTRL SHIFT, n, exec, google-chrome-stable --incognito
bind = $mod, n, exec, google-chrome-stable
bind = $mod CTRL, n, exec, google-chrome-stable --incognito
bind = $mod, e, exec, nautilus
bind = $mod SHIFT, c, exec, google-chrome-stable --app=https://claude.ai/
bind = $mod SHIFT, w, exec, google-chrome-stable --app=https://mail.google.com/
bind = $mod SHIFT, period, exec, google-chrome-stable --app=https://calendar.google.com/
bind = $mod SHIFT, semicolon, exec, obs
bind = $mod, c, exec, ~/.local/bin/colorpicker
bind = $mod CTRL, r, exec, ~/.local/bin/speak-clipboard
bind = $mod, s, exec, ~/.local/bin/screenshot screen
bind = $mod SHIFT, s, exec, ~/.local/bin/screenshot area
bind = $mod ALT, s, exec, ~/.local/bin/screenshot window
bind = $mod CTRL, s, exec, ~/.local/bin/screen-ocr-area
bind = $mod, v, exec, desktop-shell launcher --provider clipboard
bind = $mod SHIFT, v, exec, desktop-shell notifications
bind = $mod SHIFT, p, exec, ~/.local/bin/monitors-off
bind = $mod, grave, exec, desktop-shell windows
bind = $mod, comma, exec, desktop-shell controls
bind = $mod CTRL, d, exec, desktop-shell launcher
bind = $mod SHIFT, q, killactive
workspace = 1, monitor:eDP-1
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
workspace = 2, monitor:eDP-1
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
workspace = 3, monitor:eDP-1
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
workspace = 4, monitor:eDP-1
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
workspace = 5, monitor:eDP-1
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
workspace = 6, monitor:eDP-1
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
workspace = 7, monitor:eDP-1
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
workspace = 8, monitor:eDP-1
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
workspace = 9, monitor:eDP-1
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
workspace = 10, monitor:eDP-2
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 0, movetoworkspacesilent, 10
bind = $mod, Up, workspace, m-1
bind = $mod SHIFT, Up, movetoworkspace, m-1
bind = $mod, Down, workspace, m+1
bind = $mod SHIFT, Down, movetoworkspace, m+1
bind = $mod, mouse_up, workspace, m-1
bind = $mod CTRL, mouse_up, movetoworkspace, m-1
bind = $mod, mouse_down, workspace, m+1
bind = $mod CTRL, mouse_down, movetoworkspace, m+1
bind = $mod, h, movefocus, l
bind = $mod SHIFT, h, movewindow, l
bind = ALT, h, focusmonitor, l
bind = $mod ALT, h, movecurrentworkspacetomonitor, l
bind = $mod, j, movefocus, d
bind = $mod SHIFT, j, movewindow, d
bind = ALT, j, focusmonitor, d
bind = $mod ALT, j, movecurrentworkspacetomonitor, d
bind = $mod, k, movefocus, u
bind = $mod SHIFT, k, movewindow, u
bind = ALT, k, focusmonitor, u
bind = $mod ALT, k, movecurrentworkspacetomonitor, u
bind = $mod, l, movefocus, r
bind = $mod SHIFT, l, movewindow, r
bind = ALT, l, focusmonitor, r
bind = $mod ALT, l, movecurrentworkspacetomonitor, r
bind = $mod, bracketleft, movewindow, l
bind = $mod, bracketright, movewindow, r
bind = $mod, f, fullscreen, 0
bind = $mod, equal, fullscreen, 0
bind = $mod, b, layoutmsg, preselect r
bind = $mod CTRL, v, layoutmsg, preselect d
bind = $mod, Tab, togglefloating
bind = $mod SHIFT, Tab, exec, if hyprctl -j activewindow | jq -e .floating >/dev/null; then hyprctl dispatch focuswindow tiled; else hyprctl dispatch focuswindow floating; fi
# Hyprland groups replace both Sway tabbed/stacking container views.
bind = $mod CTRL, t, togglegroup
bind = $mod CTRL SHIFT, s, togglegroup
bind = $mod CTRL, e, layoutmsg, togglesplit
bind = $mod, minus, resizeactive, -5% 0
bind = $mod, plus, resizeactive, 5% 0
bind = $mod SHIFT, r, exec, hyprctl reload
bindi = $mod, Escape, exec, hyprctl keyword binds:disable_keybind_grabbing $(hyprctl -j getoption binds:disable_keybind_grabbing | jq "if .int == 0 then 1 else 0 end")
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = , F2, exec, kitty --class theme-prompt -e ~/.local/bin/theme-prompt theme
bind = SHIFT, F2, exec, kitty --class theme-prompt -e ~/.local/bin/theme-prompt accent
bind = , F3, exec, ~/.local/bin/media play
bind = , F4, exec, ~/.local/bin/media prev
bind = , F5, exec, ~/.local/bin/media next
bind = , F6, exec, ~/.local/bin/volume mute
bind = , F7, exec, ~/.local/bin/volume down
bind = , F8, exec, ~/.local/bin/volume up
bind = , F9, exec, kitty --class audio-route-prompt -e ~/.local/bin/audio-route
bind = SHIFT, F9, exec, kitty --class call-record-prompt -e ~/.local/bin/call-record-menu
bind = SHIFT, F10, exec, kitty --class pomodoro-prompt -e ~/.local/bin/pomodoro menu
bindl = , XF86AudioRaiseVolume, exec, ~/.local/bin/volume up
bindl = , XF86AudioLowerVolume, exec, ~/.local/bin/volume down
bindl = , XF86AudioMute, exec, ~/.local/bin/volume mute
bindl = , XF86AudioPlay, exec, ~/.local/bin/media play
bindl = , XF86AudioNext, exec, ~/.local/bin/media next
bindl = , XF86AudioPrev, exec, ~/.local/bin/media prev

bind = $mod, mouse_left, movefocus, l
bind = $mod, mouse_right, movefocus, r
