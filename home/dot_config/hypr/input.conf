input {
    kb_options = caps:none
    numlock_by_default = true
    follow_mouse = 0
    accel_profile = flat
    touchpad {
        tap-to-click = true
        disable_while_typing = true
        natural_scroll = true
        clickfinger_behavior = true
    }
}
cursor {
    inactive_timeout = 1
}
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,48
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,48
# Vertical gestures preserve the established stacked-display workflow.
gesture = 3, up, dispatcher, workspace, m+1
gesture = 3, down, dispatcher, workspace, m-1
