# 0.56 named rules (not removed windowrulev2 syntax).
windowrule {
    name = utility-dialogs
    match:class = ^(gcr-prompter|org\.pulseaudio\.pavucontrol|pavucontrol|blueman-manager|io\.bassi\.Amberol)$
    float = on
    center = on
}
windowrule {
    name = short-prompts
    match:class = ^(sleep-monitors|audio-route|call-record)-prompt$
    float = on
    center = on
    size = 640 200
}
windowrule {
    name = long-prompts
    match:class = ^(theme|pomodoro)-prompt$
    float = on
    center = on
    size = 640 300
}
windowrule {
    name = browser-shortcuts
    match:class = ^(google-chrome|chrome-.*)$
    no_shortcuts_inhibit = on
}
windowrule {
    name = picture-in-picture
    match:title = ^Picture-in-Picture$
    float = on
    pin = on
}
layerrule {
    name = desktop-shell-blur
    match:namespace = ^desktop-shell-.*$
    blur = on
    ignore_alpha = 0.2
}
