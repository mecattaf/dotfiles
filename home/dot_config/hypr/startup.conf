# Physical-session target starts Vicinae, Mako and the Solid shell after env import.
# Kanshi retains the measured Duo profiles, adaptive sync and per-panel colour temperature.
exec-once = wl-gammarelay-rs run
exec-once = sh -c 'sleep 0.5 && kanshi'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 48
exec-once = gsettings set org.gnome.desktop.interface text-scaling-factor 1.0
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout ''
exec-once = gsettings set com.github.stunkymonkey.nautilus-open-any-terminal terminal kitty
exec-once = theme apply
