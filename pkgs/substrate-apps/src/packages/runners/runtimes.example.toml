# ~/.config/substrate/runtimes.toml  (or AX_CONWIP_RUNTIMES=/path/to/file)
#
# Where agent() calls run. No file at all means every call runs on "host".
# Per call:  agent(prompt, { runtime: "gvisor" })
# Per phase: the [phases] table below.  Otherwise: `default`.

default = "host"

[seats]
dsh = "gufo"

[phases]
"Review" = "gvisor"          # every agent() in the "Review" phase
"Scout" = "gufo"             # harness stays on NAS; Gufo inference runs on strix-coordinator

[credentials]
claude = "~/.claude"          # the seat config dir; MOUNTED into sandboxes, never copied
mode = "rw"                   # rw seat config mount (Tom, 2026-09-21)
# Desk context bound READ-ONLY into gVisor jobs (never microvm: 9p shares dirs only):
# context = ["~/today/CLAUDE.md", "~/.claude/skills", "~/mecattaf/dotfiles/home/agent-runtime-rules.md"]

# Seat id -> that seat's Claude config dir. A claude job mounts the dir of the seat it is
# gated on and never another. Required as soon as a claude runtime binds a seat (runtime
# `seat = ...` or [seats].claude), unless `claude` above is set and only one seat is bound.
# [credentials.seats]
# cc = "~/.claude"
# cc2 = "~/.claude-work"

# Untrusted input: no seat credential, no host loopback. The name `locked` is reserved for
# exactly this shape (gVisor, credential = false, network not "host"); a call may always
# move into it, allow list or not. A claude harness is refused there (it needs a credential).
# [runtime.locked]
# type = "gvisor"
# runsc = "/nix/store/...-gvisor/bin/runsc"
# harness = "pi"
# credential = false
# network = "isolated"

[runtime.gvisor]
type = "gvisor"
runsc = "/nix/store/da343m78crf7s2d2b3yrb7hjpsb44gq4-gvisor-20260406.0/bin/runsc"
# state = "~/.local/state/substrate/runsc"   # runsc --root; never under /run/user
# network = "host"                           # or "none"

[runtime.herdr]
type = "herdr"
# mode = "action"             # plugin action with native exit_code/stdout/stderr; "pane" for a visible pane
# socket = "~/.config/herdr/herdr.sock"

[runtime.vm]
type = "microvm"              # builds a microvm.nix declaredRunner; boots only where /dev/kvm is reachable under runtime-test
# vcpu = 2
# memMiB = 2048

[runtime.gufo]
type = "host"
harness = "dsh"
provider = "gufo"
seat = "gufo"

[runtime.edge]
type = "workerd"              # Worker-shaped jobs only; agent() calls are refused
# workerd = "/nix/store/...-workerd-.../bin/workerd"   # else built from github:mecattaf/workerd.nix#workerd

[runtime.ax]
type = "ax"                   # spec only: writes the Task an ax dispatch would send, dispatches nothing

# Native DSH local model; the fleet launcher owns endpoint and model metadata.
# [[models]]
# id = "qwen3.8-flash-next"
# harness = "dsh"
# provider = "gufo"
# aliases = ["local", "nightly"]
# default = true
#
# The model catalog (src/models.ts) is RUNTIME DATA (2026-10-10): name a plain TOML file of
# [[models]] tables and the runners re-read it on every call (an edit is live at once, no
# restart, no rebuild). It must exist at load. It outranks the inline [[models]] below; absent
# both, the built-in list applies: claude-opus-5-5 (default, alias "opus"), claude-fable-5-1
# (alias "fable", model-scoped ceiling 90), the Gufo model for pi, qwen3.8-max for
# qwen-token-plan, deepseek/deepseek-v4-pro (default) and three more for openrouter, and NO
# entry for openrouter-free (parked, see below).
# models_file = "~/.config/substrate/models.toml"
#
# A call naming a model outside the list runs the harness default, and the route records the
# request. Ceilings are percent used; at or above one the capacity gate refuses that model while
# the seat still takes others. A pi PROVIDER with no entry is PARKED: its runtime is refused at
# the route with "no model configured", route policies fall through, pi is never dialled.
#
# [[models]]
# id = "claude-opus-5-5"
# harness = "claude"
# aliases = ["opus"]
# default = true
# ceilings = { five_hour = 95, seven_day = 95 }
#
# [[models]]
# id = "claude-fable-5-1"
# harness = "claude"
# aliases = ["fable"]
# ceilings = { model_scoped = 90 }
#
# A real codex runs only when [seats] binds it: codex = "codex". With no
# `default = true` codex entry, codex runs its own configured default model.

# Seat routing: agent(p, { seat: "codex" }) or runsOn: ["seat:codex"] runs on the ONE runtime
# this file permits the call that spends that seat (the phase/default runtime first), else it is
# refused with the runtime=seat list. codex tables may let codex write in its job dir:
# [runtime.codex]
# type = "host"
# harness = "codex"
# seat = "codex"
# codexSandbox = "workspace-write"   # default "read-only"

# Legacy pi examples below are retained for historical configurations; the fleet no longer installs pi.
# pi against another provider of ~/.pi/agent/models.json (2026-09-30). `provider` is pi-only:
# gufo (default), qwen-token-plan, openrouter, openrouter-free. Without `seat`, each spends its
# provider's own seat (pi-qwencloud, openrouter, openrouter-free), never [seats].pi. Host-side
# runtimes only (host, runtime-test, herdr, ssh): a sandbox gets a Gufo-only models.json.
# The model is agent({model}) resolved against that provider's allowlist (models.ts).
# [runtime.qwen]
# type = "host"
# harness = "pi"
# provider = "qwen-token-plan"      # pi --provider qwen-token-plan --model qwen3.8-max
# seat = "pi-qwencloud"
#
# [runtime.openrouter]
# type = "host"
# harness = "pi"
# provider = "openrouter"           # --model deepseek/deepseek-v4-pro unless the call names an allowlisted id
# seat = "openrouter"
#
# [runtime.openrouter-free]
# type = "host"
# harness = "pi"
# provider = "openrouter-free"      # --provider openrouter --model <the catalog's openrouter-free entry>; PARKED while none
# seat = "openrouter-free"
#
# A stealth model pi's own catalog does not know yet is declared in the models file with a
# [models.pi] table; the runner injects it into a job-scoped pi agent dir (the host's
# models.json as data plus that one model, PI_CODING_AGENT_DIR), so activating the lane is one
# table in the data file:
# [[models]]
# id = "stealth/<new-model>"
# harness = "pi"
# provider = "openrouter-free"
# default = true
# [models.pi]
# name = "<display name> (stealth, free)"
# reasoning = true
# input = ["text", "image"]
# context_window = 1000000
# max_tokens = 524288
#
# Host-side pi jobs save their session in the job's shadow (`--session-dir`) and it is archived
# with the transcripts (~/.local/state/substrate/transcripts/<run>/<job>/pi-*.jsonl), which is
# what the seats oracle reads to count factory spend on a credit-metered seat.

# Agent sessions (sessions chapter, 2026-10-12): agent({session: {id, harnessSessionId, cwd?, role, harness?}})
# resumes the harness session by id (claude --session-id then --resume, pi --session-id) in
# <transcript root>/sessions/<id>/, whose cwd/ is the session's cwd on every turn, with the one
# `project` MCP: `<project_bin> mcp` with PROJECT_URL, PROJECT_TOKEN_FILE, PROJECT_SESSION_ID and
# PROJECT_ROLE, also set on the harness. A session call naming no runtime runs on the first host
# runtime of its model's catalog harness and pi provider, never on codex. Without this table a
# session call is refused.
# [sessions]
# project_bin = "project"                              # the default
# project_url = "https://project.example.dev"
# project_token_file = "~/.config/project/token"
